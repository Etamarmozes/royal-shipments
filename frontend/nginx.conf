# ----------------------------------------------------------------------------
# In-container nginx — serves the React SPA + proxies /api/* to the backend.
#
# Outside this container, a host-level nginx on the Hetzner box terminates TLS
# for app.royallinenshipments.com and forwards plain HTTP to this container.
# So we do NOT handle TLS here — only static serving + /api proxy.
#
# `backend` resolves over the docker-compose network to the FastAPI service.
# ----------------------------------------------------------------------------

# Use docker's embedded DNS so the upstream hostname is re-resolved on
# container restart (compose may give backend a new IP).
resolver 127.0.0.11 valid=30s ipv6=off;

# Compress text-ish responses — JS/CSS/JSON are the big ones for an SPA.
gzip            on;
gzip_vary       on;
gzip_min_length 1024;
gzip_proxied    any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml;

server {
    listen      80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Allow uploading large Excel / PDF documents through the SPA.
    client_max_body_size 50M;

    # Don't leak the nginx version in error pages / headers.
    server_tokens off;

    # ---- /api/* → FastAPI backend ----
    # The host reverse proxy could equally hit api.royallinenshipments.com
    # directly, but this in-container proxy lets the SPA always use the
    # same-origin /api prefix (no CORS needed in production either).
    location /api/ {
        # Strip the /api prefix when proxying upstream.
        rewrite ^/api/(.*)$ /$1 break;

        # `backend` is the service name in docker-compose.
        proxy_pass http://backend:8000;

        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Forwarded-Host  $host;
        proxy_set_header    Connection        "";

        # File uploads / Excel imports can take a while — generous timeouts.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;
    }

    # ---- Hashed static assets — long-cache, immutable ----
    # Vite emits files like /assets/index-AbCdEf12.js with content hashes,
    # so they can be cached forever.  index.html is NOT cached.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- Icons, manifest, service worker ----
    # The service worker MUST never be cached by intermediaries, or users
    # get stuck on old versions.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---- Light security headers ----
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection          "0"              always;
    # Permissions-Policy intentionally minimal — extend if you add cameras / mics.
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ---- SPA fallback ----
    # React-Router uses HTML5 history mode → /shipments/123 must return index.html
    # so the SPA can route client-side.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html itself must NOT be cached — otherwise users get stuck
        # on an old bundle after a deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- Don't log noisy probes ----
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
