# ----------------------------------------------------------------------------
# Host nginx site — app.royallinenshipments.com (frontend SPA)
# ----------------------------------------------------------------------------
# Install:  /etc/nginx/sites-available/app.royallinenshipments.com.conf
# Enable:   ln -s ../sites-available/app.royallinenshipments.com.conf  \
#                  /etc/nginx/sites-enabled/
#
# TLS certs are issued by certbot:
#   sudo certbot --nginx -d app.royallinenshipments.com
# certbot will rewrite the `listen 443 ssl` block + cert paths automatically.
# ----------------------------------------------------------------------------

# ---- HTTP → HTTPS redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name app.royallinenshipments.com;

    # Let certbot's ACME challenge through unmodified.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS (after `certbot --nginx`) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.royallinenshipments.com;

    # certbot will fill these in; before that, comment the block + run certbot.
    ssl_certificate     /etc/letsencrypt/live/app.royallinenshipments.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.royallinenshipments.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;

    # ---- Uploads can be large (multi-MB Excel, PDFs, images) ----
    client_max_body_size 50M;

    # ---- Proxy → frontend container (bound to 127.0.0.1:8080 by compose) ----
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Pass real client info — needed by FastAPI's --forwarded-allow-ips
        # so it sees real IPs in logs / X-Forwarded-* headers.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        # Big-upload friendly timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;
    }

    access_log /var/log/nginx/app.royallinenshipments.com.access.log;
    error_log  /var/log/nginx/app.royallinenshipments.com.error.log warn;
}
