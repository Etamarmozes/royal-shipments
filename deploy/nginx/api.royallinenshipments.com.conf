# ----------------------------------------------------------------------------
# Host nginx site — api.royallinenshipments.com (FastAPI backend)
# ----------------------------------------------------------------------------
# Install:  /etc/nginx/sites-available/api.royallinenshipments.com.conf
# Enable:   ln -s ../sites-available/api.royallinenshipments.com.conf  \
#                  /etc/nginx/sites-enabled/
#
# Note: in normal traffic the SPA reaches the backend via its in-container
# proxy (app.…/api/...).  This subdomain exists primarily for:
#   - Gmail OAuth callback (api.…/gmail/callback)
#   - Direct API access from external integrations / mobile clients
#   - Webhooks
# ----------------------------------------------------------------------------

# ---- HTTP → HTTPS redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name api.royallinenshipments.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.royallinenshipments.com;

    ssl_certificate     /etc/letsencrypt/live/api.royallinenshipments.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.royallinenshipments.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"   always;
    add_header X-Frame-Options           "DENY"      always;
    add_header Referrer-Policy           "no-referrer" always;

    server_tokens off;

    # ---- Uploads ----
    client_max_body_size 50M;

    # ---- Proxy → backend container (bound to 127.0.0.1:8000 by compose) ----
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;
    }

    # ---- Optional: rate-limit auth endpoints to slow brute-force ----
    # See nginx.conf snippet below — needs `limit_req_zone` in the http{} block.
    # location /auth/login {
    #     limit_req zone=auth_login burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:8000;
    #     ... same proxy headers as above ...
    # }

    access_log /var/log/nginx/api.royallinenshipments.com.access.log;
    error_log  /var/log/nginx/api.royallinenshipments.com.error.log warn;
}

# ----------------------------------------------------------------------------
# Optional global rate-limit zone — add to /etc/nginx/nginx.conf inside http{}:
#
#     limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
#
# Then uncomment the location /auth/login block above.
# ----------------------------------------------------------------------------
